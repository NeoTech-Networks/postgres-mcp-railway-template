# Builds both images this template ships (gateway and mcp) on every PR and on
# main. Eight production Railway services build from these two Dockerfiles, so
# the "docker-build" gate job is the required status check on main.
name: docker-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The gateway's nginx config is rendered at container start, not at build
  # time, so a broken template passes the image build and only fails once it
  # reaches Railway. This job starts the real image and asserts the routing
  # and auth behaviour the gateway is responsible for.
  gateway-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image locally
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: false
          load: true
          tags: gateway:ci
          cache-from: type=gha,scope=gateway

      - name: Start stub upstream
        run: |
          docker network create ci-net
          mkdir -p stub
          # The real upstream answers on /mcp, so the stub must too. Serving
          # only / would make every proxied request 404 and the assertions
          # below would be testing nothing.
          printf 'upstream root\n' > stub/index.html
          printf 'upstream mcp\n' > stub/mcp
          docker run -d --name mcp --network ci-net \
            -v "$PWD/stub:/usr/share/nginx/html:ro" \
            nginx:1.29.8-alpine

      - name: Start gateway
        run: |
          docker run -d --name gw --network ci-net \
            -e API_KEYS=goodkeyone,goodkeytwo \
            -e MCP_HOST=mcp \
            -e MCP_PORT=80 \
            -e PORT=8080 \
            -p 8080:8080 gateway:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz >/dev/null

      - name: nginx config is valid
        run: docker exec gw nginx -t

      - name: Assertions
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          echo "healthz is open"
          [ "$(code http://localhost:8080/healthz)" = 200 ]

          echo "bare /mcp with no credential is rejected"
          [ "$(code http://localhost:8080/mcp)" = 401 ]

          echo "bare /mcp with a bad bearer is rejected"
          [ "$(code -H 'Authorization: Bearer nope' http://localhost:8080/mcp)" = 401 ]

          echo "bare /mcp with a good bearer reaches the upstream"
          [ "$(code -H 'Authorization: Bearer goodkeyone' http://localhost:8080/mcp)" = 200 ]
          curl -s -H 'Authorization: Bearer goodkeyone' http://localhost:8080/mcp | grep -q 'upstream mcp'

          echo "keyed path with no key at all is rejected"
          [ "$(code http://localhost:8080/k//mcp)" = 401 ]

          echo "keyed path with a bad key is rejected"
          [ "$(code http://localhost:8080/k/nope/mcp)" = 401 ]

          echo "keyed path with a good key reaches the upstream"
          [ "$(code http://localhost:8080/k/goodkeytwo/mcp)" = 200 ]

          echo "keyed path lands on /mcp upstream, not on the key segment"
          curl -s http://localhost:8080/k/goodkeytwo/mcp | grep -q 'upstream mcp'

          echo "a valid key does not unlock any other path"
          [ "$(code http://localhost:8080/k/goodkeyone/tools)" = 401 ]
          [ "$(code http://localhost:8080/k/goodkeyone/)" = 401 ]

      # UPSTREAM_KEY: an echo upstream reports the Authorization header it
      # received, so the assertions see exactly what the gateway forwarded.
      - name: Start echo upstream and UPSTREAM_KEY gateways
        run: |
          mkdir -p echo
          cat > echo/default.conf <<'EOF'
          server {
            listen 80;
            location / {
              default_type text/plain;
              return 200 "upstream mcp auth=[$http_authorization]\n";
            }
          }
          EOF
          docker run -d --name echo --network ci-net \
            -v "$PWD/echo/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.29.8-alpine
          docker run -d --name gw-up --network ci-net \
            -e API_KEYS=clientkey \
            -e UPSTREAM_KEY=upstreamkey \
            -e MCP_HOST=echo -e MCP_PORT=80 -e PORT=8081 \
            -p 8081:8081 gateway:ci
          docker run -d --name gw-pt --network ci-net \
            -e API_KEYS=clientkey \
            -e MCP_HOST=echo -e MCP_PORT=80 -e PORT=8082 \
            -p 8082:8082 gateway:ci
          for p in 8081 8082; do
            for i in $(seq 1 30); do
              curl -fsS http://localhost:$p/healthz >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost:$p/healthz >/dev/null
          done
          docker exec gw-up nginx -t
          docker exec gw-pt nginx -t

      - name: UPSTREAM_KEY assertions
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          echo "UPSTREAM_KEY set: the client key is still required"
          [ "$(code http://localhost:8081/mcp)" = 401 ]
          [ "$(code -H 'Authorization: Bearer upstreamkey' http://localhost:8081/mcp)" = 401 ]

          echo "UPSTREAM_KEY set: header path forwards the upstream key, not the client key"
          body=$(curl -s -H 'Authorization: Bearer clientkey' http://localhost:8081/mcp)
          echo "$body"
          [ "$body" = "upstream mcp auth=[Bearer upstreamkey]" ]

          echo "UPSTREAM_KEY set: keyed path forwards the upstream key"
          body=$(curl -s http://localhost:8081/k/clientkey/mcp)
          echo "$body"
          [ "$body" = "upstream mcp auth=[Bearer upstreamkey]" ]

          echo "UPSTREAM_KEY unset: header path passes the client header through"
          body=$(curl -s -H 'Authorization: Bearer clientkey' http://localhost:8082/mcp)
          echo "$body"
          [ "$body" = "upstream mcp auth=[Bearer clientkey]" ]

          echo "UPSTREAM_KEY unset: keyed path forwards no Authorization (as before)"
          body=$(curl -s http://localhost:8082/k/clientkey/mcp)
          echo "$body"
          [ "$body" = "upstream mcp auth=[]" ]

          echo "UPSTREAM_KEY with an unsafe character refuses to start"
          if docker run --rm -e API_KEYS=clientkey -e 'UPSTREAM_KEY=bad"key' \
               -e MCP_HOST=echo gateway:ci nginx -t; then
            echo "gateway accepted an unsafe UPSTREAM_KEY"; exit 1
          fi

      - name: Gateway logs on failure
        if: failure()
        run: |
          docker logs gw || true
          docker logs gw-up || true
          docker logs gw-pt || true

  # MCP_AUTH_KEY on the mcp image: starts the real postgres-mcp against a
  # throwaway Postgres, with and without the key, and runs the gateway in front
  # of the keyed one to prove the full rollout shape end to end.
  mcp-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build mcp image locally
        uses: docker/build-push-action@v6
        with:
          context: mcp
          push: false
          load: true
          tags: mcp:ci
          cache-from: type=gha,scope=mcp

      - name: Build gateway image locally
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: false
          load: true
          tags: gateway:ci
          cache-from: type=gha,scope=gateway

      - name: Start Postgres, both mcp variants and a keyed gateway
        run: |
          docker network create ci-net
          docker run -d --name pg --network ci-net \
            -e POSTGRES_PASSWORD=ci postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec pg pg_isready -U postgres
          DB=postgresql://postgres:ci@pg:5432/postgres

          # Key set: nginx on 3000, postgres-mcp on loopback 8000.
          docker run -d --name mcp-auth --network ci-net \
            -e DATABASE_URI="$DB" -e PORT=3000 -e MCP_AUTH_KEY=mcpkey \
            -p 3000:3000 mcp:ci
          # Key unset: postgres-mcp on 3000 directly, as today.
          docker run -d --name mcp-open --network ci-net \
            -e DATABASE_URI="$DB" -e PORT=3000 \
            -p 3001:3000 mcp:ci
          # Gateway in front of the keyed mcp, sending the mcp key upstream.
          docker run -d --name gw-e2e --network ci-net \
            -e API_KEYS=clientkey -e UPSTREAM_KEY=mcpkey \
            -e MCP_HOST=mcp-auth -e MCP_PORT=3000 -e PORT=8080 \
            -p 8080:8080 gateway:ci

      - name: Wait for postgres-mcp
        run: |
          cat > init.json <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}
          EOF
          init() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data @init.json "$@"
          }
          for i in $(seq 1 60); do
            a=$(init -H 'Authorization: Bearer mcpkey' http://localhost:3000/mcp || true)
            b=$(init http://localhost:3001/mcp || true)
            [ "$a" = 200 ] && [ "$b" = 200 ] && break
            sleep 2
          done
          echo "keyed=$a open=$b"

      - name: Assertions
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$@"; }
          init() {
            code -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data @init.json "$@"
          }

          echo "MCP_AUTH_KEY set: /health is open"
          [ "$(code http://localhost:3000/health)" = 200 ]

          echo "MCP_AUTH_KEY set: initialize with no key is rejected"
          [ "$(init http://localhost:3000/mcp)" = 401 ]

          echo "MCP_AUTH_KEY set: initialize with a wrong key is rejected"
          [ "$(init -H 'Authorization: Bearer wrongkey' http://localhost:3000/mcp)" = 401 ]

          echo "MCP_AUTH_KEY set: initialize with the right key succeeds"
          [ "$(init -H 'Authorization: Bearer mcpkey' http://localhost:3000/mcp)" = 200 ]
          body=$(curl -s --max-time 15 -X POST \
            -H 'Authorization: Bearer mcpkey' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data @init.json http://localhost:3000/mcp || true)
          echo "$body"
          echo "$body" | grep -q '"serverInfo"'

          echo "MCP_AUTH_KEY set: postgres-mcp itself is not reachable from the network"
          if docker exec gw-e2e wget -q -T 3 -O /dev/null http://mcp-auth:8000/mcp; then
            echo "postgres-mcp answered on the network port"; exit 1
          fi

          echo "MCP_AUTH_KEY unset: initialize with no key succeeds (unchanged)"
          [ "$(init http://localhost:3001/mcp)" = 200 ]
          body=$(curl -s --max-time 15 -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data @init.json http://localhost:3001/mcp || true)
          echo "$body"
          echo "$body" | grep -q '"serverInfo"'

          echo "end to end: client key at the gateway, mcp key upstream"
          [ "$(init -H 'Authorization: Bearer clientkey' http://localhost:8080/mcp)" = 200 ]
          [ "$(init http://localhost:8080/mcp)" = 401 ]

      - name: Logs on failure
        if: failure()
        run: |
          docker logs mcp-auth || true
          docker logs mcp-open || true
          docker logs gw-e2e || true

  docker-build:
    needs: [build, gateway-config, mcp-auth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        shell: bash
        run: |
          echo "build=${{ needs.build.result }}"
          echo "gateway-config=${{ needs.gateway-config.result }}"
          echo "mcp-auth=${{ needs.mcp-auth.result }}"
          [ "${{ needs.build.result }}" = "success" ] || { echo "one or both image builds failed"; exit 1; }
          [ "${{ needs.gateway-config.result }}" = "success" ] || { echo "gateway config check failed"; exit 1; }
          [ "${{ needs.mcp-auth.result }}" = "success" ] || { echo "mcp auth check failed"; exit 1; }
